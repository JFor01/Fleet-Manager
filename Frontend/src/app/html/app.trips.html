

<section class="trips" aria-labelledby="trips-heading">

  <div class="table-wrap">
    <table>
      <thead>
      <tr>
        <th scope="col">Driver</th>
        <th scope="col">Car</th>
        <th scope="col">From</th>
        <th scope="col">To</th>
        <th scope="col">Status</th>

      </tr>
      </thead>
      <tbody id="trip-table-body">

    </table>

</section>
